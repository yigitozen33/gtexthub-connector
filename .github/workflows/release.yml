# Builds unsigned installers when a version tag is pushed (v*), and on demand.
# macOS: dmg for arm64 and x64. Windows: NSIS installer for x64.
# A tag like v1.2.3 builds against the production API and opens a DRAFT release.
# A tag like v1.2.3-preview.1 builds against the PREVIEW API and publishes a PRE-RELEASE
# that testers can download directly. A manual run picks the API with the `env` input.
# Code signing and notarization are NOT configured yet (see README, "Açık konular").
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      env:
        description: API the installers talk to
        type: choice
        options: [production, preview]
        default: production

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run typecheck
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
    runs-on: ${{ matrix.os }}
    env:
      GTH_ENV: ${{ (contains(github.ref_name, '-preview') || inputs.env == 'preview') && 'preview' || 'production' }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package
        shell: bash
        run: |
          version_args=()
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version_args=(-c.extraMetadata.version="${GITHUB_REF_NAME#v}")
          fi
          npx electron-builder ${{ matrix.target }} --publish never "${version_args[@]}"
      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true
      - name: Create the GitHub release with the installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-preview* ]]; then
            gh release create "${GITHUB_REF_NAME}" installers/* \
              --repo "${GITHUB_REPOSITORY}" \
              --prerelease \
              --title "GTextHub Bağlayıcı ${GITHUB_REF_NAME} (test, önizleme sunucusu)" \
              --notes "Test derlemesi: önizleme sunucusuna (xkjhy36p.mindbricks.dev) bağlanır. İmzasızdır; macOS'ta Sistem Ayarları > Gizlilik ve Güvenlik > Yine de Aç, Windows'ta Ek bilgi > Yine de çalıştır ile açılır."
          else
            gh release create "${GITHUB_REF_NAME}" installers/* \
              --repo "${GITHUB_REPOSITORY}" \
              --draft \
              --title "GTextHub Bağlayıcı ${GITHUB_REF_NAME}" \
              --notes "İmzasız derleme. Gerçek dağıtımdan önce kod imzalama ve notarization gerekir."
          fi
